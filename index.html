<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New問道場</title>
<style>
  :root {
    --color-bg: #f2f2f0;
    --color-page-bg: #ececeb;
    --color-surface: #ffffff;
    --color-accent: #00a968;
    --color-accent-dark: #00874f;
    --color-border: #dcdcd8;
    --color-choice-bg: #f7f7f2;
    --color-correct: #2e7d32;
    --color-correct-bg: #e8f5e9;
    --color-wrong: #c62828;
    --color-wrong-bg: #ffebee;
    --color-text: #333333;
    --color-text-sub: #999999;
    --color-answer-label: #c0504d;
    --radius: 4px;
    --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body.dark-mode {
    --color-bg: #1e1e22;
    --color-page-bg: #17171a;
    --color-surface: #26262b;
    --color-accent: #2ecf8e;
    --color-accent-dark: #56dba5;
    --color-border: #3a3a40;
    --color-choice-bg: #2e2e34;
    --color-correct: #66bb6a;
    --color-correct-bg: #1f3a22;
    --color-wrong: #ef5350;
    --color-wrong-bg: #3a1f1f;
    --color-text: #e8e8ea;
    --color-text-sub: #9a9aa0;
    --color-answer-label: #e08a87;
  }

  body {
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-page-bg);
    font-family: var(--font);
    color: var(--color-text);
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 24px 60px;
    position: relative;
  }

  .breadcrumb {
    font-size: 13px;
    color: var(--color-text-sub);
    margin-bottom: 20px;
  }
  .breadcrumb-home {
    cursor: pointer;
    text-decoration: none;
    color: var(--color-text-sub);
  }
  .breadcrumb-home:hover {
    color: var(--color-accent);
    text-decoration: underline;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--color-border);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }
  .header-logo {
    color: var(--color-accent);
    font-size: 0.7em;
    line-height: 1;
  }

  /* HOME画面ではタイトルを2倍サイズ・中央配置 */
  .header.home-mode {
    justify-content: center;
  }

  .header.home-mode .header-title {
    font-size: 56px;
    gap: 8px;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "YuMincho", serif;
    font-weight: 700;
  }

  .header.home-mode .header-logo {
    font-size: 0.85em;
  }

  /* スマホ問題画面用の下部ラベル */
  .mobile-choice-bar {
    display: none;
  }

  /* HOME画面 */
  .home-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    padding: 24px;
  }

  .set-list-heading {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text-sub);
    margin: 0 0 12px;
  }

  .set-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .set-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    font-size: 14px;
    background: var(--color-choice-bg);
  }

  .set-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--color-accent);
    cursor: pointer;
  }

  .set-item label {
    cursor: pointer;
    flex: 1;
  }
  .set-item:not(.is-checked) label {
    color: var(--color-text-sub);
  }

  .option-section {
    border-top: 1px solid var(--color-border);
    padding-top: 20px;
    margin-bottom: 28px;
  }
  .option-heading {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text-sub);
    margin: 0 0 12px;
  }
  .option-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
  }
  .option-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--color-accent);
    cursor: pointer;
  }
  .option-item label { cursor: pointer; }

  .start-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 14px 32px;
    font-size: 17px;
    font-weight: 700;
    background: rgb(255, 178, 0);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
  }
  .start-btn:hover { background: rgb(230, 160, 0); }
  .start-btn:disabled {
    background: var(--color-border);
    cursor: not-allowed;
  }

  .ai-disclaimer {
    text-align: center;
    font-size: 11px;
    color: var(--color-text-sub);
    opacity: 0.7;
    margin: 10px 0 0;
  }

  .stats-bar {
    text-align: center;
    font-size: 15px;
    color: var(--color-text);
    margin-bottom: 24px;
  }
  .stats-bar strong { font-weight: 700; }
  .stats-bar .divider {
    color: var(--color-border);
    margin: 0 12px;
  }

  .question-meta {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 16px;
  }

  .question-text {
    font-size: 16px;
    line-height: 1.9;
    margin: 0 0 28px;
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    background: var(--color-choice-bg);
    border: 1px solid var(--color-border);
    padding: 24px;
  }

  .choice-item {
    flex: 1 1 0;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
  }

  .choice-label {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border: 1px solid #b7b7b0;
    background: var(--color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--color-text);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .choice-label:hover {
    border-color: var(--color-accent);
  }
  .choice-label:active {
    transform: scale(0.93);
  }

  .choice-value {
    font-size: 18px;
    color: var(--color-text);
    cursor: pointer;
    transition: opacity 0.2s ease;
    user-select: none;
  }
  .choice-value.is-dimmed {
    opacity: 0.35;
  }

  .choice-label:disabled,
  .choice-value.is-disabled {
    cursor: default;
  }

  .choice-item.is-correct .choice-label {
    background: var(--color-correct);
    border-color: var(--color-correct);
    color: #fff;
  }
  .choice-item.is-correct .choice-value {
    color: var(--color-correct);
    font-weight: 700;
    opacity: 1;
  }

  .choice-item.is-wrong .choice-label {
    background: var(--color-wrong);
    border-color: var(--color-wrong);
    color: #fff;
  }
  .choice-item.is-wrong .choice-value {
    color: var(--color-wrong);
    font-weight: 700;
    opacity: 1;
  }

  /* 正答表示エリア(問題選択画面の下に出現) */
  .answer-panel {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    transition: max-height 0.5s ease, opacity 0.4s ease, transform 0.4s ease, margin-top 0.5s ease;
    margin-top: 0;
  }
  .answer-panel.is-open {
    max-height: 2000px;
    opacity: 1;
    transform: translateY(0);
    margin-top: 32px;
  }

  .answer-heading {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  .answer-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 28px;
  }
  .answer-label {
    font-size: 22px;
    font-weight: 700;
    color: var(--color-answer-label);
  }
  .answer-user-text {
    font-size: 15px;
    color: var(--color-text-sub);
  }

  .explanation-heading {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  .explanation-box {
    background: var(--color-choice-bg);
    border: 1px solid var(--color-border);
    padding: 20px 24px;
    font-size: 16px;
    line-height: 2;
    color: var(--color-text);
  }

  .panel-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  .next-btn {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    background: rgb(255, 178, 0);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    max-width: 420px;
  }
  .next-btn:hover { background: rgb(230, 160, 0); }

  .home-link-btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    background: transparent;
    color: var(--color-text-sub);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
  }
  .home-link-btn:hover {
    border-color: var(--color-text-sub);
    color: var(--color-text);
  }

  /* 結果画面 */
  .result-screen {
    text-align: center;
    padding: 50px 20px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
  }
  .result-label {
    font-size: 15px;
    color: var(--color-text-sub);
    margin: 0;
  }
  .result-score {
    font-size: 46px;
    font-weight: 700;
    margin: 14px 0 4px;
  }
  .result-sub {
    color: var(--color-accent-dark);
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 32px;
  }
  .result-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .retry-btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    background: var(--color-accent);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
  }
  .retry-btn:hover { background: var(--color-accent-dark); }

  .hidden { display: none; }

  /* 正誤演出(画面中央、背景への影響なし) */
  .judge-flash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
  }
  .judge-flash.is-active {
    animation: flash-visibility 0.7s ease forwards;
  }

  @keyframes flash-visibility {
    0% { opacity: 0; }
    15% { opacity: 1; }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }

  .judge-streak {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.55);
    padding: 6px 20px;
    border-radius: 999px;
    transform: translateY(10px) scale(0.8);
    opacity: 0;
  }
  .judge-flash.is-active .judge-streak {
    animation: streak-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes streak-pop {
    0% { transform: translateY(10px) scale(0.7); opacity: 0; }
    40% { transform: translateY(0) scale(1.1); opacity: 1; }
    60% { transform: translateY(0) scale(0.97); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .judge-mark {
    width: 140px;
    height: 140px;
    transform: scale(0.4);
    opacity: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  .judge-flash.is-active .judge-mark {
    animation: mark-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes mark-pop {
    0% { transform: scale(0.3); opacity: 0; }
    40% { transform: scale(1.15); opacity: 1; }
    60% { transform: scale(0.95); opacity: 1; }
    80% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .judge-mark circle,
  .judge-mark line {
    fill: none;
    stroke-linecap: round;
  }
  .judge-flash.correct .judge-mark circle {
    stroke: var(--color-correct);
    stroke-width: 10;
  }
  .judge-flash.wrong .judge-mark line {
    stroke: var(--color-wrong);
    stroke-width: 10;
  }

  /* スマホ対応 */
  @media (max-width: 640px) {
    #app { padding: 16px 16px 88px; }
    .header-title { font-size: 20px; }
    .header.home-mode .header-title { font-size: 40px; }
    .choices {
      flex-direction: column;
      padding: 12px 16px;
    }
    .choice-item {
      min-width: 0;
      padding: 12px 4px;
      border-bottom: 1px solid var(--color-border);
    }
    .choice-item:last-child { border-bottom: none; }

    .mobile-choice-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 90;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100vw;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
    }

    .mobile-choice-bar span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      font-size: 16px;
      font-weight: 700;
      border-right: 1px solid var(--color-border);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-choice-bar span:active {
      background: var(--color-choice-bg);
    }

    .mobile-choice-bar span:last-child {
      border-right: none;
    }

    .mobile-choice-bar.hidden {
      display: none;
    }

    .judge-mark { width: 110px; height: 110px; }
  }
</style>
</head>
<body>

<div id="app">

  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-home" id="breadcrumb-home">HOME</span>
  </div>

  <div class="header">
    <h1 class="header-title">
      <span class="header-logo">◤</span>New問道場
    </h1>
  </div>

  <!-- HOME画面 -->
  <div id="home-screen">
    <div class="home-card">
      <p class="set-list-heading">問題選択</p>
      <div class="set-list" id="set-list"></div>

      <div class="option-section">
        <p class="option-heading">オプション項目</p>
        <div class="option-item">
          <input type="checkbox" id="option-random" />
          <label for="option-random">選択肢をランダムに並べ替える</label>
        </div>
        <div class="option-item" style="margin-top: 10px;">
          <input type="checkbox" id="option-question-random" />
          <label for="option-question-random">出題順をランダムに並び替える</label>
        </div>
      </div>

      <div class="option-section">
        <p class="option-heading">設定</p>
        <div class="option-item">
          <input type="checkbox" id="option-dark-mode" />
          <label for="option-dark-mode">ダークモード</label>
        </div>
      </div>

      <button class="start-btn" id="start-btn">出題開始</button>
      <p class="ai-disclaimer">問題の作成はAIを使用しており、誤っている場合があります。ご注意ください。</p>
    </div>
  </div>

  <!-- 問題画面 -->
  <div id="quiz-container" class="hidden">
    <div class="stats-bar">
      正解数 <strong id="stat-correct">0</strong> / <strong id="stat-total">0</strong> 問中
      <span class="divider">|</span>
      正答率 <strong id="stat-rate">0.0%</strong>
    </div>

    <div id="quiz-screen">
      <p class="question-meta" id="question-meta">第 1 問</p>
      <p class="question-text" id="question-text"></p>

      <div class="choices" id="choices-container"></div>
    </div>

    <div class="answer-panel" id="answer-panel">
      <p class="answer-heading">正解:</p>
      <div class="answer-row">
        <span class="answer-label" id="answer-label"></span>
        <span class="answer-user-text" id="answer-user-text"></span>
      </div>

      <p class="explanation-heading">解説:</p>
      <div class="explanation-box" id="explanation-text"></div>

      <div class="panel-actions">
        <button class="next-btn" id="next-btn">次の問題へ</button>
        <button class="home-link-btn" id="home-btn-explanation">HOMEへ戻る</button>
      </div>
    </div>

    <div id="result-screen" class="hidden result-screen">
      <p class="result-label">結果</p>
      <p class="result-score" id="final-score"></p>
      <p class="result-sub" id="final-sub"></p>
      <div class="result-actions">
        <button class="retry-btn" id="retry-btn">もう一度挑戦する</button>
        <button class="home-link-btn" id="home-btn-result">HOMEへ戻る</button>
      </div>
    </div>
  </div>

</div>

<div class="mobile-choice-bar hidden" id="mobile-choice-bar" aria-hidden="true">
  <span data-choice-index="0">ア</span>
  <span data-choice-index="1">イ</span>
  <span data-choice-index="2">ウ</span>
  <span data-choice-index="3">エ</span>
</div>

<div class="judge-flash" id="judge-flash">
  <span class="judge-streak" id="judge-streak" style="display:none;"></span>
  <svg class="judge-mark" id="judge-mark-correct" viewBox="0 0 100 100" style="display:none;">
    <circle cx="50" cy="50" r="38"/>
  </svg>
  <svg class="judge-mark" id="judge-mark-wrong" viewBox="0 0 100 100" style="display:none;">
    <line x1="26" y1="26" x2="74" y2="74"/>
    <line x1="74" y1="26" x2="26" y2="74"/>
  </svg>
</div>

<script>
// ------------------------------------------------------------
// 問題セットデータ(サンプル)。本番ではここに問題集を追加する。
// correctIndex は choices 配列の何番目が正解かを 0始まり で指定。
// ------------------------------------------------------------
const questionSets = [
  {
    id: 'sample',
    name: 'サンプル問題集',
    questions: [
      {
        question: "日本の首都はどこですか?",
        choices: ["大阪", "東京", "京都", "名古屋"],
        correctIndex: 1,
        explanation: "日本の首都は東京都です。1868年に江戸から東京へと改称されました。"
      },
      {
        question: "水の化学式はどれですか?",
        choices: ["CO2", "NaCl", "H2O", "O2"],
        correctIndex: 2,
        explanation: "水は水素原子2個と酸素原子1個から構成されており、化学式は H2O です。"
      },
      {
        question: "1年で最も日照時間が長い日を何と呼びますか?",
        choices: ["夏至", "冬至", "春分", "秋分"],
        correctIndex: 0,
        explanation: "夏至は北半球で1年のうち最も昼が長くなる日で、6月21日頃にあたります。"
      },
      {
        question: "地球から最も近い惑星はどれですか?",
        choices: ["火星", "木星", "金星", "土星"],
        correctIndex: 2,
        explanation: "地球に最も近い惑星は金星です。地球のすぐ内側の軌道を公転しています。"
      }
    ]
  },
      {
        id: 'civics',
        name: '公共自習用問題集',
        questions: [
          {
            question: "観念論の立場では、従来の「人間の認識は、外にある対象をそのまま写し取っている」という考え方を逆転させ、「人間の認識の枠組み（主観）が、対象を組み立てている」と主張した。この「対象が認識に従う」という考え方の具体的な説明として、最も適切なものはどれか。",
            choices: ["人間は、客観的な世界をありのままに正しく認識することができる。", "人間は、自分が持っている認識のメガネを通してしか、世界を経験できない。", "人間の心はもともと「白紙（タブラ・ラサ）」であり、すべての知識は経験によって後から書き込まれる。", "人間の理性を正しく用いれば、神の存在や世界の果てなど、あらゆる真理を完全に証明できる。"],
            correctIndex: 1,
            explanation: "カントは「認識が対象に従う」という従来の考えを逆転させ、「対象（の認識）が主観の枠組みに従う」というコペルニクス的転回を唱えた。人間は生まれつき備わった認識の形式（時間・空間・カテゴリーなど）を通してしか世界を経験できない、というイが正解。アは素朴実在論、ウはロックの経験論（タブラ・ラサ）、エはカントが批判した独断的形而上学の立場。"

            explanation: "アは正しい。権力の分立（三権分立）は、権力の濫用を防ぐために国家権力を立法・行政・司法に分割し、それぞれ異なる機関に担わせる原理であり、モンテスキューが体系化した。イは誤り。法の支配は、法が国民だけでなく権力者をも拘束するという原則であり、権力の分割そのものを指す言葉ではない。ウは誤り。一般意志はルソーの概念で、公共の利益を目指す人民全体の意志を指す。エは誤り。王権神授説は国王の権力が神に由来するとする学説であり、権力分立とは対立する発想である。"
          },
          {
            question: "ラッサールが、国家の役割を国防や治安維持など必要最小限にとどめるべきだとする自由放任的な国家観を批判的に呼んだ言葉は何か。",
            choices: ["福祉国家", "夜警国家", "立憲国家", "社会国家"],
            correctIndex: 1,
            explanation: "アは誤り。福祉国家は国民の福祉の充実を積極的な役割とする国家観であり、ラッサールが批判した対象とは逆の方向性である。イは正しい。夜警国家は、国家の役割を国防・治安維持など必要最小限にとどめるべきとする自由放任的な国家観を、ラッサールが批判的に呼んだ言葉である。ウは誤り。立憲国家は憲法に基づいて統治が行われる国家を指し、夜警国家とは異なる観点の概念である。エは誤り。社会国家は福祉国家と近い概念で、国民生活への国家の積極的関与を重視する国家観である。"
          },
          {
            question: "「権力は腐敗する。絶対的権力は絶対に腐敗する」という言葉を残したことで知られるイギリスの歴史家・思想家は誰か。",
            choices: ["モンテスキュー", "アクトン", "ロック", "ホッブズ"],
            correctIndex: 1,
            explanation: "アは誤り。モンテスキューは三権分立を主張した思想家であり、この言葉を残した人物ではない。イは正しい。「権力は腐敗する。絶対的権力は絶対に腐敗する」は、イギリスの歴史家アクトンが残した、権力の集中に対する警句として知られる言葉である。ウは誤り。ロックは『統治二論』の著者で、抵抗権や社会契約説を説いた思想家である。エは誤り。ホッブズは『リヴァイアサン』の著者で、社会契約説の先駆者の一人である。"
          }
        ]
      }
];

// ------------------------------------------------------------
// アプリ本体
// ------------------------------------------------------------
let quizData = [];
let currentSetName = '';
let currentIndex = 0;
let correctCount = 0;
let answeredCount = 0;
let currentStreak = 0;
let randomizeChoices = false;
let randomizeQuestionOrder = false;
// 問題選択の状態を保持する（初期状態はすべて未選択）
const checkedSetIds = new Set();

const homeScreen = document.getElementById('home-screen');
const quizContainer = document.getElementById('quiz-container');
const headerEl = document.querySelector('.header');
const mobileChoiceBarEl = document.getElementById('mobile-choice-bar');
const quizScreen = document.getElementById('quiz-screen');
const answerPanel = document.getElementById('answer-panel');
const resultScreen = document.getElementById('result-screen');

const breadcrumbEl = document.getElementById('breadcrumb');
breadcrumbEl.addEventListener('click', (e) => {
  if (e.target.closest('#breadcrumb-home')) {
    goHome();
  }
});
const setListEl = document.getElementById('set-list');
const optionRandomEl = document.getElementById('option-random');
const optionQuestionRandomEl = document.getElementById('option-question-random');
const optionDarkModeEl = document.getElementById('option-dark-mode');

// ------------------------------------------------------------
// ダークモード
// ------------------------------------------------------------
(function initDarkMode() {
  let saved = false;
  try {
    saved = localStorage.getItem('darkMode') === 'true';
  } catch (e) { /* localStorage不可の環境では無視 */ }
  optionDarkModeEl.checked = saved;
  document.body.classList.toggle('dark-mode', saved);
})();

optionDarkModeEl.addEventListener('change', () => {
  const enabled = optionDarkModeEl.checked;
  document.body.classList.toggle('dark-mode', enabled);
  try {
    localStorage.setItem('darkMode', enabled);
  } catch (e) { /* localStorage不可の環境では無視 */ }
});
const startBtnEl = document.getElementById('start-btn');

const statCorrectEl = document.getElementById('stat-correct');
const statTotalEl = document.getElementById('stat-total');
const statRateEl = document.getElementById('stat-rate');

const questionMetaEl = document.getElementById('question-meta');
const questionTextEl = document.getElementById('question-text');
const choicesContainerEl = document.getElementById('choices-container');

const answerLabelEl = document.getElementById('answer-label');
const answerUserTextEl = document.getElementById('answer-user-text');
const explanationTextEl = document.getElementById('explanation-text');
const nextBtnEl = document.getElementById('next-btn');
const homeBtnExplanationEl = document.getElementById('home-btn-explanation');

const finalScoreEl = document.getElementById('final-score');
const finalSubEl = document.getElementById('final-sub');
const retryBtnEl = document.getElementById('retry-btn');
const homeBtnResultEl = document.getElementById('home-btn-result');

const judgeFlashEl = document.getElementById('judge-flash');
const judgeMarkCorrectEl = document.getElementById('judge-mark-correct');
const judgeMarkWrongEl = document.getElementById('judge-mark-wrong');
const judgeStreakEl = document.getElementById('judge-streak');

const choiceLabels = ['ア', 'イ', 'ウ', 'エ', 'オ', 'カ'];

// スマホ下部ラベルから直接回答できるようにする
mobileChoiceBarEl.querySelectorAll('span[data-choice-index]').forEach((label) => {
  label.addEventListener('click', () => {
    if (answerPanel.classList.contains('is-open')) return;
    const index = Number(label.dataset.choiceIndex);
    const q = quizData[currentIndex];
    if (!q || index >= q.choices.length) return;
    handleAnswer(index);
  });
});

// ------------------------------------------------------------
// HOME画面
// ------------------------------------------------------------
function renderHome() {
  breadcrumbEl.innerHTML = '<span class="breadcrumb-home" id="breadcrumb-home">HOME</span>';
  headerEl.classList.add('home-mode');
  mobileChoiceBarEl.classList.add('hidden');
  mobileChoiceBarEl.setAttribute('aria-hidden', 'true');
  setListEl.innerHTML = '';

  questionSets.forEach((set) => {
    const isChecked = checkedSetIds.has(set.id);

    const item = document.createElement('div');
    item.className = isChecked ? 'set-item is-checked' : 'set-item';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `set-${set.id}`;
    checkbox.checked = isChecked;
    checkbox.dataset.setId = set.id;
    checkbox.addEventListener('change', () => {
      item.classList.toggle('is-checked', checkbox.checked);
      if (checkbox.checked) {
        checkedSetIds.add(set.id);
      } else {
        checkedSetIds.delete(set.id);
      }
    });

    const label = document.createElement('label');
    label.setAttribute('for', `set-${set.id}`);
    label.textContent = `${set.name}(${set.questions.length}問)`;

    item.appendChild(checkbox);
    item.appendChild(label);
    setListEl.appendChild(item);
  });
}

startBtnEl.addEventListener('click', () => {
  const checkedBoxes = setListEl.querySelectorAll('input[type="checkbox"]:checked');
  if (checkedBoxes.length === 0) return;

  // 選択された問題集の問題を結合
  let combined = [];
  let combinedNames = [];
  checkedBoxes.forEach((box) => {
    const set = questionSets.find((s) => s.id === box.dataset.setId);
    if (set) {
      combined = combined.concat(set.questions);
      combinedNames.push(set.name);
    }
  });

  quizData = combined.map((q) => {
    const cloned = JSON.parse(JSON.stringify(q));
    // 解説内の「ア・イ・ウ・エ」を、選択肢の元の位置と紐づけて管理する。
    cloned.originalChoices = [...cloned.choices];
    cloned.originalCorrectIndex = cloned.correctIndex;
    cloned.choiceOriginalIndices = cloned.choices.map((_, index) => index);
    return cloned;
  });
  currentSetName = combinedNames.join('・');
  randomizeChoices = optionRandomEl.checked;
  randomizeQuestionOrder = optionQuestionRandomEl.checked;

  if (randomizeQuestionOrder) {
    quizData = shuffleQuestions(quizData);
  }

  if (randomizeChoices) {
    quizData = quizData.map((q) => shuffleChoices(q));
  }

  currentIndex = 0;
  correctCount = 0;
  answeredCount = 0;
  currentStreak = 0;
  updateStats();

  homeScreen.classList.add('hidden');
  headerEl.classList.remove('home-mode');
  quizContainer.classList.remove('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  answerPanel.classList.remove('is-open');
  mobileChoiceBarEl.classList.remove('hidden');
  mobileChoiceBarEl.setAttribute('aria-hidden', 'false');

  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function shuffleQuestions(questions) {
  const shuffled = [...questions];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function shuffleChoices(q) {
  const originalChoices = q.originalChoices || q.choices;
  const shuffledIndices = originalChoices.map((_, index) => index);

  for (let i = shuffledIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
  }

  const shuffled = shuffledIndices.map((originalIndex) => originalChoices[originalIndex]);
  const originalCorrectIndex = q.originalCorrectIndex ?? q.correctIndex;

  return {
    ...q,
    choices: shuffled,
    correctIndex: shuffledIndices.indexOf(originalCorrectIndex),
    choiceOriginalIndices: shuffledIndices
  };
}

function formatExplanation(q) {
  const originalToCurrent = {};
  const currentIndices = q.choiceOriginalIndices || q.choices.map((_, index) => index);

  currentIndices.forEach((originalIndex, currentIndex) => {
    if (choiceLabels[originalIndex]) {
      originalToCurrent[choiceLabels[originalIndex]] = choiceLabels[currentIndex];
    }
  });

  // 「アウフヘーベン」のような通常の単語内のカタカナは対象にせず、
  // 選択肢ラベルとして独立している「ア・イ・ウ・エ」だけを置換する。
  return (q.explanation || '').replace(
    /(?<![ァ-ヶ])([アイウエオカ])(?![ァ-ヶ])/g,
    (_, label) => originalToCurrent[label] || label
  );
}

function goHome() {
  quizContainer.classList.add('hidden');
  homeScreen.classList.remove('hidden');
  answerPanel.classList.remove('is-open');
  mobileChoiceBarEl.classList.add('hidden');
  mobileChoiceBarEl.setAttribute('aria-hidden', 'true');
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ------------------------------------------------------------
// 問題画面
// ------------------------------------------------------------
function updateStats() {
  const rate = answeredCount === 0 ? 0 : (correctCount / answeredCount) * 100;
  statCorrectEl.textContent = correctCount;
  statTotalEl.textContent = answeredCount;
  statRateEl.textContent = `${rate.toFixed(1)}%`;
}

function renderQuestion() {
  const q = quizData[currentIndex];

  breadcrumbEl.innerHTML = `<span class="breadcrumb-home" id="breadcrumb-home">HOME</span> » ${currentSetName} » ${currentIndex + 1}問目`;
  questionMetaEl.textContent = `第 ${currentIndex + 1} 問`;
  questionTextEl.textContent = q.question;
  choicesContainerEl.innerHTML = '';

  q.choices.forEach((choiceText, index) => {
    const item = document.createElement('div');
    item.className = 'choice-item';

    const labelBtn = document.createElement('button');
    labelBtn.type = 'button';
    labelBtn.className = 'choice-label';
    labelBtn.textContent = choiceLabels[index];
    labelBtn.addEventListener('click', () => handleAnswer(index));

    const valueSpan = document.createElement('span');
    valueSpan.className = 'choice-value';
    valueSpan.textContent = choiceText;
    // 文章タッチ:色を薄くする/戻すトグル(回答確定とは無関係)
    valueSpan.addEventListener('click', () => {
      valueSpan.classList.toggle('is-dimmed');
    });

    item.appendChild(labelBtn);
    item.appendChild(valueSpan);
    choicesContainerEl.appendChild(item);
  });
}

function handleAnswer(selectedIndex) {
  const q = quizData[currentIndex];
  const isCorrect = selectedIndex === q.correctIndex;

  answeredCount++;
  if (isCorrect) {
    correctCount++;
    currentStreak++;
  } else {
    currentStreak = 0;
  }
  updateStats();

  const items = choicesContainerEl.querySelectorAll('.choice-item');
  items.forEach((item, index) => {
    const labelBtn = item.querySelector('.choice-label');
    const valueSpan = item.querySelector('.choice-value');
    labelBtn.disabled = true;
    valueSpan.classList.add('is-disabled');
    valueSpan.classList.remove('is-dimmed');
    if (index === q.correctIndex) {
      item.classList.add('is-correct');
    } else if (index === selectedIndex) {
      item.classList.add('is-wrong');
    }
  });

  playJudgeAnimation(isCorrect);
  showAnswerPanel(isCorrect, selectedIndex);
}

function playJudgeAnimation(isCorrect) {
  judgeMarkCorrectEl.style.display = isCorrect ? 'block' : 'none';
  judgeMarkWrongEl.style.display = isCorrect ? 'none' : 'block';

  if (isCorrect && currentStreak >= 3) {
    judgeStreakEl.textContent = `${currentStreak}問連続!`;
    judgeStreakEl.style.display = 'block';
  } else {
    judgeStreakEl.style.display = 'none';
  }

  judgeFlashEl.className = 'judge-flash ' + (isCorrect ? 'correct' : 'wrong');
  void judgeFlashEl.offsetWidth;
  judgeFlashEl.classList.add('is-active');
  setTimeout(() => {
    judgeFlashEl.classList.remove('is-active');
  }, 750);
}

function showAnswerPanel(isCorrect, selectedIndex) {
  const q = quizData[currentIndex];

  answerLabelEl.textContent = choiceLabels[q.correctIndex];
  answerUserTextEl.textContent = `"あなたの解答:${choiceLabels[selectedIndex]}"`;
  explanationTextEl.textContent = formatExplanation(q);

  nextBtnEl.textContent = (currentIndex === quizData.length - 1) ? '結果を見る' : '次の問題へ';

  // パネルを完全に展開してから、すぐに最下部へのスクロールを開始する。
  const scrollToBottom = () => {
    const mobileBar = window.matchMedia('(max-width: 640px)').matches
      ? mobileChoiceBarEl.offsetHeight
      : 0;
    const maxTop = Math.max(
      0,
      document.documentElement.scrollHeight - window.innerHeight + mobileBar + 8
    );

    window.scrollTo({
      top: maxTop,
      behavior: 'smooth'
    });
  };

  const onPanelExpanded = (event) => {
    // max-height の展開完了時だけ実行する
    if (event.propertyName !== 'max-height') return;
    answerPanel.removeEventListener('transitionend', onPanelExpanded);

    // レイアウトが確定した直後にスクロール開始
    requestAnimationFrame(scrollToBottom);
  };

  answerPanel.addEventListener('transitionend', onPanelExpanded);
  answerPanel.classList.add('is-open');
}

nextBtnEl.addEventListener('click', () => {
  currentIndex++;
  answerPanel.classList.remove('is-open');

  if (currentIndex >= quizData.length) {
    quizScreen.classList.add('hidden');
    mobileChoiceBarEl.classList.add('hidden');
    mobileChoiceBarEl.setAttribute('aria-hidden', 'true');
    showResult();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

function showResult() {
  breadcrumbEl.innerHTML = `<span class="breadcrumb-home" id="breadcrumb-home">HOME</span> » ${currentSetName} » 結果`;
  resultScreen.classList.remove('hidden');
  const total = quizData.length;
  const rate = Math.round((correctCount / total) * 100);
  finalScoreEl.textContent = `${correctCount} / ${total} 問正解`;
  finalSubEl.textContent = `正答率 ${rate}%`;
}

retryBtnEl.addEventListener('click', () => {
  currentIndex = 0;
  correctCount = 0;
  answeredCount = 0;
  currentStreak = 0;
  updateStats();
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  answerPanel.classList.remove('is-open');
  headerEl.classList.remove('home-mode');
  mobileChoiceBarEl.classList.remove('hidden');
  mobileChoiceBarEl.setAttribute('aria-hidden', 'false');

  if (randomizeQuestionOrder) {
    quizData = shuffleQuestions(quizData);
  }

  if (randomizeChoices) {
    quizData = quizData.map((q) => shuffleChoices(q));
  }

  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

homeBtnExplanationEl.addEventListener('click', goHome);
homeBtnResultEl.addEventListener('click', goHome);

// 初期表示
renderHome();
</script>

</body>
</html>
